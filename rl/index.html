<script>
(()=>{
/* ---------- simulations: every figure that says "live" draws from these ---------- */
function rng(seed){let s=seed%2147483647||1;if(s<0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}
function gauss(R){let u=0,v=0;while(u===0)u=R();v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const memo={};const once=(k,f)=>memo[k]||(memo[k]=f());

/* The running example: Cliff Walking, 4 x 12 (Sutton & Barto; used in the Model-Free Control note). */
const ROWS=4,COLS=12,NST=ROWS*COLS,START=3*COLS,GOAL=3*COLS+11;
const DR=[-1,0,1,0],DC=[0,1,0,-1],ANAME=["up","right","down","left"],AGL=["↑","→","↓","←"];
const rowOf=s=>Math.floor(s/COLS),colOf=s=>s%COLS;
const isCliff=s=>rowOf(s)===3&&colOf(s)>0&&colOf(s)<11;
function step(s,a){let r=rowOf(s)+DR[a],c=colOf(s)+DC[a];if(r<0||r>=ROWS||c<0||c>=COLS){r=rowOf(s);c=colOf(s);}const n=r*COLS+c;
  if(isCliff(n))return{n:START,r:-100,fell:true,hit:n};return{n,r:-1,done:n===GOAL,hit:n};}
function movesToPath(moves){const p=[START];let s=START;for(const a of moves){const o=step(s,a);if(o.fell){p.push(o.hit);s=START;p.push(START);}else{s=o.n;p.push(s);}}return p;}
const U=0,R_=1,D=2,L=3;
const EDGE=[U,...Array(11).fill(R_),D];                                   // 13 steps along the cliff
const SAFE=[U,U,U,...Array(11).fill(R_),D,D,D];                           // 17 steps along the top
const FALLER=[U,R_,R_,R_,R_,R_,D,U,...Array(11).fill(R_),D];              // walks 5 right, steps off, starts again
const WANDER=[U,R_,U,R_,R_,D,R_,R_,U,R_,R_,R_,D,R_,R_,R_,D];             // a meandering 17-step walk

function qOf(V,gamma,p,s,a){let q=0;for(let b=0;b<4;b++){const w=(b===a?1-p:0)+p/4;if(!w)continue;const o=step(s,b);q+=w*(o.r+(o.done?0:gamma*V[o.n]));}return q;}
function greedyA(V,gamma,p,s){let best=-1e18,ba=0;for(let a=0;a<4;a++){const q=qOf(V,gamma,p,s,a);if(q>best+1e-9){best=q;ba=a;}}return ba;}
function viHist(gamma,p,sweeps){const out=[new Float64Array(NST)];let V=out[0];
  for(let k=0;k<sweeps;k++){const N=new Float64Array(NST);for(let s=0;s<NST;s++){if(s===GOAL||isCliff(s))continue;let b=-1e18;for(let a=0;a<4;a++)b=Math.max(b,qOf(V,gamma,p,s,a));N[s]=b;}V=N;out.push(V);}return out;}
function greedyPath(pol,max=60){const path=[START],seen=new Set([START]);let s=START;for(let i=0;i<max&&s!==GOAL;i++){const o=step(s,pol(s));if(o.fell){path.push(o.hit);return{path,fell:true};}s=o.n;path.push(s);if(seen.has(s))return{path,loop:true};seen.add(s);}return{path,ok:s===GOAL};}
/* policy iteration from the uniform random policy, gamma 0.9; records evaluation sweeps and each improved policy */
function piHist(gamma){const frames=[];let pol=null;let V=new Float64Array(NST);
  const evalQ=(V,s,pol)=>{if(pol===null){let q=0;for(let a=0;a<4;a++)q+=qOf(V,gamma,0,s,a)/4;return q;}return qOf(V,gamma,0,s,pol[s]);};
  for(let it=0;it<8;it++){const sweeps=[];for(let k=0;k<400;k++){const N=new Float64Array(NST);let d=0;for(let s=0;s<NST;s++){if(s===GOAL||isCliff(s))continue;N[s]=evalQ(V,s,pol);d=Math.max(d,Math.abs(N[s]-V[s]));}V=N;if(k<6||k%8===0)sweeps.push(V);if(d<1e-6)break;}sweeps.push(V);
    const np=new Int8Array(NST);let changed=0;for(let s=0;s<NST;s++){if(s===GOAL||isCliff(s))continue;let b=pol?pol[s]:0,bq=pol?qOf(V,gamma,0,s,pol[s]):-1e18;for(let a=0;a<4;a++){const q=qOf(V,gamma,0,s,a);if(q>bq+1e-9){bq=q;b=a;}}np[s]=b;if(!pol||pol[s]!==b)changed++;}
    frames.push({pol,sweeps,next:np,changed});if(pol&&changed===0)break;pol=np;}

    bars.push(el("rect",{x,y:T.y,width:w,height:0,rx:2,style:big?"fill:var(--bad)":"fill:var(--violet);fill-opacity:.8"},g));

    if(n<N){el("rect",{x:x0+n*bw+3,y:y-11,width:bw-6,height:22,rx:6,style:`fill:none;stroke:${c};stroke-width:2;stroke-dasharray:4 3`},g);el("text",{x:x0+n*bw+bw/2,y:y+4,"text-anchor":"middle",class:"mono",style:`font-size:${narrow?8.5:10}px;fill:${c};font-weight:700`,text:"V(s"+["₃","₄","₅","₆","₇","₈","₉","₁₀"][n-1]+")"},g);}

  const B={x:x0,y:yL+18,w:x1-x0,h:H-yL-60};el("line",{x1:B.x,x2:B.x+B.w,y1:B.y+B.h,y2:B.y+B.h,class:"axl"},g);

/* 9.4 PFN: the posterior predictive a prior-data fitted network is trained to output (computed exactly on a grid) */
BUILD.pfn=(svg,W,H)=>{
  const narrow=W<520,g=el("g",{},svg),R=rng(23),tt=[.4,1.6],N=30,DATA=[];for(let i=0;i<N;i++){const x=-3+6*R();DATA.push([x,R()<sigm(tt[1]*x+tt[0])?1:0]);}

  const lp=[];for(const a of G0)for(const b of G1)lp.push(-a*a/2-b*b/8);
  const post=n=>{const w=lp.slice();let k=0;for(const a of G0)for(const b of G1){let s=0;for(let i=0;i<n;i++){const p=sigm(b*DATA[i][0]+a);s+=Math.log(DATA[i][1]?p:1-p);}w[k++]+=s;}const mx=Math.max(...w);let z=0;for(let i=0;i<w.length;i++){w[i]=Math.exp(w[i]-mx);z+=w[i];}return w.map(v=>v/z);};

  const sm=[0,1,2,3,4,5].map(()=>el("path",{style:"fill:none;stroke:var(--accent);stroke-width:1;opacity:.28"},g)),pp=el("path",{style:"fill:none;stroke:var(--accent);stroke-width:3.2"},g);
  const dots=DATA.map(()=>el("circle",{r:4.5},g));
  legend(g,B.x,22,narrow?[["var(--accent)","predictive"],["var(--good)","true task",1]]:[["var(--accent)","posterior predictive (bold) and posterior samples"],["var(--good)","the hidden true task",1]],14);
  const T=15,at=t=>clamp(Math.floor(N*clamp(t/12,0,1)),0,N);
  return{t0:0,t1:T,rest:T,speed:1,label:"",
    update(t){const n=at(t),P=PP[n];pp.setAttribute("d",poly(P.xs.map((x,i)=>[fr.sx(x),fr.sy(P.ys[i])])));
      P.smp.forEach(([a,b],m)=>{let d="";for(let x=-3;x<=3.001;x+=.15)d+=(x===-3?"M":"L")+fr.sx(x).toFixed(1)+" "+fr.sy(sigm(b*x+a)).toFixed(1);sm[m].setAttribute("d",d);});
      DATA.forEach((d,i)=>{const c=dots[i];if(i>=n){c.setAttribute("opacity",0);return;}c.setAttribute("opacity",1);c.setAttribute("cx",fr.sx(d[0]));c.setAttribute("cy",fr.sy(d[1]?1.02:-.02));c.setAttribute("style",`fill:${d[1]?"var(--gold)":"var(--bg)"};stroke:var(--gold);stroke-width:2`);});},
    readout(t){const n=at(t),P=PP[n],i0=P.xs.findIndex(x=>x>=-.05);return[["context points",String(n)],["P(y = 1 | x = 0)",P.ys[i0].toFixed(3)+`  (true task: ${sigm(tt[0]).toFixed(3)})`],["prior","t₀ ~ N(0, 1), t₁ ~ N(0, 2²), x ~ U(−3, 3)  (ours)"],["note","no trained network runs here: this is its target"]];}};

  el("text",{x:(nx[0]+nx[1])/2,y:ny[0]+32,"text-anchor":"middle",class:"ax",text:"tanh(3z₁) + ε"},g);el("text",{x:(nx[1]+nx[2])/2,y:ny[0]+32,"text-anchor":"middle",class:"ax",text:"1.5z₂ + ε"},g);

  const rows=[];for(let i=0;i<VIS;i++){const y=ty+24+i*rh;rows.push([0,1,2].map(j=>el("text",{x:D.x+j*D.w/3+6,y:y+13,class:"mono",style:"font-size:10.5px"},g)));el("line",{x1:D.x,x2:D.x+D.w,y1:y+rh,y2:y+rh,class:"gl"},g);}

  const vals=ROWS.map(r=>r[1]).slice().sort((a,b)=>a-b),K=10,edges=[-1.5];for(let k=1;k<K;k++)edges.push(vals[Math.floor(N*k/K)]);edges.push(1.5);
  const fr=frame(g,Hb,{x0:-1.6,x1:1.6,y0:0,y1:2.2,yt:[0,1,2],xt:[-1,0,1],xl:"z₂",yl:"density"});
  const bars=[];for(let k=0;k<K;k++)bars.push(el("rect",{x:fr.sx(edges[k])+.5,width:Math.max(1,fr.sx(edges[k+1])-fr.sx(edges[k])-1),style:"fill:var(--accent);fill-opacity:.55"},g));
  const gc=el("path",{style:"fill:none;stroke:var(--gold);stroke-width:2.6"},g);
  legend(g,Hb.x,Hb.y+Hb.h+(narrow?32:36),[["var(--accent)","10 equal-mass bars"],["var(--gold)","best single Gaussian"]],14);
  const T=14,at=t=>clamp(Math.floor(N*Math.pow(clamp(t/11,0,1),1.5)),1,N);
  const fit=n=>{const v=ROWS.slice(0,n).map(r=>r[1]),cnt=new Array(K).fill(0);for(const x of v){let k=0;while(k<K-1&&x>=edges[k+1])k++;cnt[k]++;}const m=v.reduce((a,b)=>a+b,0)/n,s=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/n)+1e-3;return{cnt,m,s,n};};
  const nll=f=>{const test=[],Rt=rng(31);for(let i=0;i<400;i++){const z1=gauss(Rt);test.push(Math.tanh(3*z1)+.1*gauss(Rt));}let a=0,b=0;for(const x of test){let k=0;while(k<K-1&&x>=edges[k+1])k++;const dens=(f.cnt[k]+.5)/(f.n+K*.5)/(edges[k+1]-edges[k]);a-=Math.log(dens);b-=Math.log(Math.exp(-((x-f.m)**2)/(2*f.s*f.s))/(f.s*Math.sqrt(2*Math.PI)));}return[a/400,b/400];};

const CH=[{name:"Start"},{name:"The problem"},{name:"Values and planning"},{name:"Learning from experience"},{name:"Values at scale"},{name:"Learning the policy"},{name:"Continuous actions"},{name:"Safety and trust"},{name:"Data, transfer, search"},{name:"The toolbox"},{name:"Wrap-up"}];
const chk=(q,a)=>`<div class="check"><p><b>Check yourself.</b> ${q}</p><details><summary>Show the answer</summary><p>${a}</p></details></div>`;
const PAGES=[
 {id:"start",ch:0,no:"0",title:"Learning by doing",sub:"a visual companion to Matt Landers' RL notes",fig:{kind:"cover"},figno:"Exhibit 0",figtitle:"A robot learns the cliff",notes:[["about-rl","About RL"]],html:`
  <p class="lead">Most machine learning copies examples. Reinforcement learning (RL) learns from results: try something, see how it turns out, do more of what worked.</p>
  <p>This companion walks through every topic in <a href="https://mattlanders.net/about-rl.html" target="_blank" rel="noopener">Matt Landers' RL notes</a>, 52 pages in all: from the basic setup to PPO, GRPO and SAC, then safety, offline data, search and the supporting toolbox. One robot and one cliff carry the first half.</p>
  <p>On the right, the robot is learning to cross a grid without stepping off the cliff. Its first tries wander for hundreds of moves. Watch the episodes shrink, and watch the squares fill with colour as it learns what each one is worth.</p>
  <p class="note">Turn pages with the arrow keys, the scroll wheel, a swipe or the arrows at the top. Each figure has Play, Replay and a scrubber. Figures run real simulations in your browser unless they say “illustrative”.</p>
  <p class="note">The notes and their derivations are Matt Landers'. The plain-words explanations and figures here are an independent companion; every page links to the note it follows, for the full maths. The page format is inspired by Atlas of Physics.</p>`},

 {id:"why",ch:1,no:"1.1",title:"Copy the crowd, or chase the outcome",sub:"why RL is different",fig:{kind:"outcome"},figno:"Exhibit 1.1",figtitle:"Data shows what people do",notes:[["about-rl","About RL"]],html:`
  <p class="lead">A model trained on human examples learns what people usually do. RL learns what works.</p>
  <p>Large generative models fit the distribution of human-made text and images, so they reproduce typical human behaviour. RL is outcome-driven: it gets a number for how well things turned out and changes its behaviour to push that number up.</p>
  <p>That is how AlphaGo found Move 37 against Lee Sedol, a move top players first read as a mistake. On the right, the grey bars are people's moves and the dashed line is a model that copies them. The <span class="key">blue</span> RL policy climbs toward the best outcome, into territory the data barely covers.</p>
  <p>RL suits sequential decisions: each action changes what you can do next, the rules may be unknown, and the only feedback is a reward.</p>
  <p class="note">The figure is a one-dimensional sketch, not real Go data.</p>`},
 {id:"loop",ch:1,no:"1.2",title:"The loop",sub:"agent, environment, repeat",fig:{kind:"loop"},figno:"Exhibit 1.2",figtitle:"One step at a time",notes:[["mdp","MDPs"]],html:`
  <p class="lead">At every time step the agent sees a state, picks an action, and the environment answers with the next state and a reward.</p>
  <p>The robot is the agent. The grid is the environment. The robot never sees the rules; it only sees where it ended up and the number it got.</p>
  <div class="eq">s<sub>0</sub>, a<sub>0</sub>, r<sub>1</sub>, s<sub>1</sub>, a<sub>1</sub>, r<sub>2</sub>, s<sub>2</sub>, …<small>The reward for action a<sub>t</sub> arrives with the next state, so it is written r<sub>t+1</sub>.</small></div>
  <p>Watch move 7. The robot steps off the cliff, gets <span class="kbad">−100</span> and lands back at the start. Nothing tells it why. It has to work that out from the numbers.</p>`},
 {id:"mdp",ch:1,no:"1.3",title:"The world as an MDP",sub:"five pieces",fig:{kind:"mdp"},figno:"Exhibit 1.3",figtitle:"⟨S, A, P, R, γ⟩",notes:[["mdp","MDPs"]],html:`
  <p class="lead">A Markov decision process (MDP) is the formal version of the loop: states, actions, transition probabilities, rewards and a discount factor.</p>
  <table class="t"><tr><th>piece</th><th>in the cliff world</th></tr>
  <tr><td>S, states</td><td>48 squares</td></tr><tr><td>A, actions</td><td>up, right, down, left</td></tr>
  <tr><td>P, transitions</td><td>where a move lands, with what probability</td></tr><tr><td>R, rewards</td><td>−1 per move, −100 for the cliff</td></tr><tr><td>γ, discount</td><td>how much later rewards count</td></tr></table>
  <p><b>Markov</b> means the present is enough: where you go next depends only on where you are and what you do, not on how you got there.</p>
  <p class="note">Cliff walking is a standard example from Sutton and Barto; the course uses it in the Model-Free Control note. The robot starts at S and the episode ends at the star.</p>`},
 {id:"return",ch:1,no:"1.4",title:"Return and discount",sub:"what the agent adds up",fig:{kind:"ret"},figno:"Exhibit 1.4",figtitle:"One episode, three values of γ",notes:[["mdp","MDPs"]],html:`
  <p class="lead">The agent's score is its return: the sum of rewards, with each later reward shrunk by γ for every step of delay.</p>
  <div class="eq">G<sub>t</sub> = r<sub>t+1</sub> + <span class="hl">γ</span> r<sub>t+2</sub> + <span class="hl">γ²</span> r<sub>t+3</sub> + …</div>
  <p>With γ = 1 every reward counts in full and this episode scores −119. With γ = 0.9 it scores −61.4. With γ = 0.5 it scores −3.55, and the fall barely registers because it happens on move 7.</p>
  <p>So γ sets how far ahead the agent cares. It also keeps the sum finite when an episode could go on forever.</p>
  ${chk("Why does a small γ make the agent careless about a cliff that is far away?","A fall k moves away counts 100 × γᵏ today. At γ = 0.5 and six moves out, that is about 1.6, less than two ordinary moves.")}`},

 {id:"value",ch:2,no:"2.1",title:"What a state is worth",sub:"values and policies",fig:{kind:"tiny"},figno:"Exhibit 2.1",figtitle:"The course's two-branch example",notes:[["value-functions-and-policies","Value Functions & Policies"]],html:`
  <p class="lead">A state's value is the return you can expect from it. That depends on what you do next, so a value is always for a policy π.</p>
  <p>This is the note's example, with γ = 0.9. From s₀, action <span class="kB">a₀</span> earns 2, then 8, then −3. Action <span class="kA">a₁</span> earns 1, then 5, then 2.</p>
  <p>a₀ starts better and holds the biggest single reward. After discounting, a₁ is worth more: 7.12 against 6.77.</p>
  <div class="eq">V<sub>π</sub>(s) = E<sub>π</sub>[ G<sub>t</sub> | s<sub>t</sub> = s ]&nbsp;&nbsp;&nbsp; Q<sub>π</sub>(s, a) = E<sub>π</sub>[ G<sub>t</sub> | s<sub>t</sub> = s, a<sub>t</sub> = a ]</div>
  <p>V scores a state. Q scores a state plus a first action. A policy can be deterministic (one move per state) or stochastic (a probability for each move).</p>`},
 {id:"bellman",ch:2,no:"2.2",title:"Bellman: one step, then trust the rest",sub:"the recursion behind everything",fig:{kind:"mrp"},figno:"Exhibit 2.2",figtitle:"Every start ends at the same point",notes:[["value-functions-and-policies","Value Functions & Policies"],["policy-and-value-iteration-proofs","DP Proofs"]],html:`
  <p class="lead">The Bellman equation says a state's value is the next reward plus γ times the value of where you land.</p>
  <div class="eq">V<sub>π</sub>(s) = Σ<sub>a</sub> π(a|s) [ R(s,a) + <span class="hl">γ</span> Σ<sub>s′</sub> P(s,a,s′) V<sub>π</sub>(s′) ]</div>
  <p>In the note's two-state example, s₁ stays with probability 0.8 (+15) or moves with 0.2 (−10); s₂ returns with 0.6 (+15) or stays with 0.4 (−10). Solving the two linear equations gives v = (89.02, 82.93).</p>
  <p>You can also apply the equation over and over. On the right, 18 start points, wherever they begin, all slide to the same star. Each sweep shrinks the gap between any two of them by at least a factor of γ = 0.9.</p>
  <p class="note">That shrinking is a contraction. The proofs note uses it, with Banach's fixed-point theorem, to show that policy evaluation and value iteration always converge to one answer.</p>`},
 {id:"converge",ch:2,no:"",title:"Why it always converges",sub:"contractions and a finite number of policies",fig:{kind:"conv"},figno:"",figtitle:"Error shrinks by γ every sweep",notes:[["policy-and-value-iteration-proofs","DP Proofs"]],html:`
  <p class="lead">The proofs note shows why policy evaluation, value iteration and policy iteration can't wander or stall.</p>
  <p>The Bellman operators are contractions in the max-norm: apply one to two value functions and the largest gap between them shrinks by at least γ. Banach's fixed-point theorem then gives exactly one fixed point, and repeated application always reaches it.</p>
  <div class="eq">‖ T V − T U ‖<sub>∞</sub> ≤ γ ‖ V − U ‖<sub>∞</sub><small>For the optimality operator the key step is that two maxima differ by at most the largest gap between the things being maximised.</small></div>
  <p>On the right, value iteration on the cliff with γ = 0.9, from all zeros and from random values. Both errors fall at least as fast as γᵏ, under a bound you can compute after one sweep: γᵏ/(1 − γ) times the first change.</p>
  <p>Policy iteration stops for a simpler reason: each round is a strict improvement and a finite MDP has finitely many deterministic policies, |A|<sup>|S|</sup>. On the cliff that is 4<sup>37</sup>, and it needed 7 rounds.</p>`},
 {id:"vi",ch:2,no:"2.3",title:"Value iteration",sub:"planning with a known map",fig:{kind:"vi"},figno:"Exhibit 2.3",figtitle:"Values spread back from the star",notes:[["dynamic-programming-for-mdps","DP for MDPs"]],html:`
  <p class="lead">If you know P and R, you can compute the best values directly: repeatedly set each square to its best one-step lookahead.</p>
  <div class="eq">V(s) ← max<sub>a</sub> [ R(s,a) + γ Σ<sub>s′</sub> P(s,a,s′) V(s′) ]</div>
  <p>Here γ = 1, so a square's value is minus the number of moves to the star. Everything starts at 0. Each sweep, correct values spread one square further back from the goal (the <span class="kgold">gold</span> outlines), and the arrows show the best move so far.</p>
  <p>After 13 sweeps the start reads −13: the route along the cliff edge. Updating a guess from other guesses is called <b>bootstrapping</b>, and most of RL does it.</p>`},
 {id:"pi",ch:2,no:"2.4",title:"Policy iteration",sub:"evaluate, improve, repeat",fig:{kind:"pi"},figno:"Exhibit 2.4",figtitle:"From random moves to the best route",notes:[["dynamic-programming-for-mdps","DP for MDPs"],["policy-and-value-iteration-proofs","DP Proofs"]],html:`
  <p class="lead">Policy iteration alternates two steps: work out what the current policy is worth, then switch every square to its best move under those values.</p>
  <p>It starts from the random policy (each move 25%), with γ = 0.9. Near the cliff that policy is very costly, so the first improvement mostly says one thing: get away from the edge.</p>
  <p>That improved policy never reaches the star (its start value is −10, an endless walk). The next rounds pull a route in from the goal. By iteration 7 the route is optimal, and iteration 8 changes nothing.</p>
  <p>Each round is a strict improvement and there are finitely many policies, so it must stop. Value iteration is the special case that evaluates for one sweep before improving. The course calls the general pattern generalised policy iteration (GPI).</p>`},
 {id:"slip",ch:2,no:"2.5",title:"A slippery floor",sub:"P shapes the best route",fig:{kind:"slip"},figno:"Exhibit 2.5",figtitle:"Safer routes as slipping rises",notes:[["mdp","MDPs"],["dynamic-programming-for-mdps","DP for MDPs"]],html:`
  <p class="lead">Make the floor slippery and the best route changes, even though the rewards don't.</p>
  <p>With slip s, a move goes in a random direction s of the time. Walking the edge now risks a −100 fall, so value iteration (γ = 0.99) picks routes further from the cliff: 13 moves at 0%, 15 at 5% and 10%, 17 at 20%.</p>
  <p>The robot pays extra moves for safety. Remember this on the SARSA page: an agent that knows it sometimes stumbles should keep its distance.</p>
  ${chk("The robot's own random exploring is a kind of slippery floor. Which kind of learner will take the safe route?","One that learns the value of the policy it actually follows, stumbles included. That is SARSA, on page 3.4.")}`},

 {id:"mctd",ch:3,no:"3.1",title:"Learn from what happened",sub:"Monte Carlo and TD, without a map",fig:{kind:"mctd"},figno:"Exhibit 3.1",figtitle:"Same two episodes, two learners",notes:[["model-free-prediction","Model-Free Prediction"]],html:`
  <p class="lead">Without P and R you can't plan. You can still learn values from experience: follow the policy and keep score.</p>
  <p><span class="kB">Monte Carlo</span> (MC) waits until the episode ends, then moves each visited square toward the return that actually followed. Its target is real, so it is unbiased, but returns are noisy and episodes must end.</p>
  <p><span class="kA">Temporal-difference learning</span>, TD(0), updates after every move, from the reward it just got plus its current guess for the next square:</p>
  <div class="eq">V(s<sub>t</sub>) ← V(s<sub>t</sub>) + α [ r<sub>t+1</sub> + γ V(s<sub>t+1</sub>) − V(s<sub>t</sub>) ]<small>The bracket is the TD error δ<sub>t</sub>. Here α = 0.5 and γ = 1.</small></div>
  <p>After one episode, MC already puts the start at −8.5; TD only knows each square cost about 0.5. TD learns sooner and online, but it leans on guesses, so its early answers are biased.</p>`},
 {id:"lambda",ch:3,no:"3.2",title:"How far to look",sub:"n-step returns and TD(λ)",fig:{kind:"nstep"},figno:"Exhibit 3.2",figtitle:"One dial from TD(0) to Monte Carlo",notes:[["model-free-prediction","Model-Free Prediction"]],html:`
  <p class="lead">TD(0) and Monte Carlo are two ends of one dial: how many real rewards to use before trusting a guess.</p>
  <p>An n-step return adds n real rewards, then the estimated value of the state it reached. n = 1 is TD(0). Letting n run to the end of the episode is Monte Carlo.</p>
  <p>TD(λ) averages all of them: the 1-step return gets weight (1 − λ), the 2-step (1 − λ)λ, and so on. λ = 0 is TD(0) and λ = 1 is Monte Carlo.</p>
  <div class="eq">G<sup>λ</sup><sub>t</sub> = (1 − λ) Σ<sub>n</sub> λ<sup>n−1</sup> G<sub>t:t+n</sub></div>
  <p>The note also covers the backward view: an eligibility trace keeps a fading memory of recently visited states, so each TD error can update all of them while the agent is still moving.</p>`},
 {id:"explore",ch:3,no:"3.3",title:"Explore or exploit",sub:"ε-greedy",fig:{kind:"egreedy"},figno:"Exhibit 3.3",figtitle:"How often the best move gets picked",notes:[["model-free-control","Model-Free Control"]],html:`
  <p class="lead">To find the best move you have to try moves that currently look worse. ε-greedy is the simplest way.</p>
  <p>With probability 1 − ε, take the move with the highest Q. With probability ε, pick any move at random, the best one included. With four moves, the best one's chance is 1 − ε + ε/4.</p>
  <p>In this square, a random pick can mean stepping off the cliff. At ε = 0.1 that happens about 1 time in 40. Exploring has a real cost, and the next page shows two learners that account for it differently.</p>`},
 {id:"sarsa",ch:3,no:"3.4",title:"SARSA vs Q-learning",sub:"on-policy vs off-policy, on the cliff",fig:{kind:"cliff"},figno:"Exhibit 3.4",figtitle:"Safe route vs best route",notes:[["model-free-control","Model-Free Control"]],html:`
  <p class="lead">Both learn Q-values after every move. They differ in one term: which next move they assume.</p>
  <div class="eq"><span class="kA">SARSA</span>: r + γ Q(s′, a′)<br><span class="kB">Q-learning</span>: r + γ max<sub>a′</sub> Q(s′, a′)</div>
  <p>SARSA uses the move it will actually take next, exploration included, so it learns the value of its own ε-greedy behaviour. Q-learning uses the best next move, so it learns the greedy policy while still behaving ε-greedily. That makes it off-policy.</p>
  <p>With ε = 0.1 and α = 0.5, as in the note, Q-learning finds the optimal route along the edge, but its random steps keep throwing it off the cliff: about −51 per episode while learning. SARSA learns that the edge is dangerous for an agent that stumbles, takes the top route and earns about −27.</p>
  ${chk("Which route would SARSA learn if exploring stopped entirely (ε = 0)?","The edge route. With no random moves, SARSA's next move is the greedy one, so its target equals Q-learning's and both learn the 13-move path.")}`},
 {id:"is",ch:3,no:"3.5",title:"Importance sampling",sub:"learning about one policy from another's data",fig:{kind:"is"},figno:"Exhibit 3.5",figtitle:"Weights collapse as the horizon grows",notes:[["importance-sampling","Importance Sampling"],["off-policy-evaluation","Off-Policy Evaluation"]],html:`
  <p class="lead">Off-policy learning uses data from a behaviour policy π<sub>β</sub> to learn about a different target policy π. Importance sampling reweights each sample by how much more, or less, likely π was to produce it.</p>
  <div class="eq">E<sub>π</sub>[ f ] = E<sub>π<sub>β</sub></sub>[ π(x) / π<sub>β</sub>(x) · f(x) ]<small>For a whole trajectory the weight is a product of per-step ratios. The unknown transition probabilities cancel, so you never need P.</small></div>
  <p>Here the behaviour policy picks two actions 50/50 and the target picks the first 90% of the time, so each step multiplies a trajectory's weight by 1.8 or 0.2.</p>
  <p>The estimate stays unbiased in theory, but over long horizons nearly every weight collapses toward zero while a rare few explode. At 20 steps only about 9 of 300 trajectories still count, and the average weight, which should be 1, has drifted to 0.05 because the huge ones were never drawn.</p>
  <p class="note">That is why n-step methods cap the product at n steps, and why off-policy evaluation mixes in learned models (the doubly robust estimator).</p>`},

 {id:"approx",ch:4,no:"4.1",title:"From tables to functions",sub:"prediction with function approximation",fig:{kind:"approx"},figno:"Exhibit 4.1",figtitle:"Two weights, nineteen states",notes:[["prediction-with-function-approximation","Prediction with Approx."],["on-policy-control-with-function-approximation","On-Policy Control"]],html:`
  <p class="lead">Real problems have too many states for a table (the note's Tetris example has about 10<sup>62</sup>). So we fit a function V̂(s; θ) with far fewer weights than states.</p>
  <p>With fewer weights than states the fit can't be exact everywhere. The objective weights each state's error by μ(s), how often the policy visits it:</p>
  <div class="eq">VE(θ) = Σ<sub>s</sub> μ(s) [ V<sub>π</sub>(s) − V̂(s; θ) ]²</div>
  <p>This 19-state random walk starts in the middle, so the middle is visited most. A straight line (two weights) learned by gradient Monte Carlo tracks the true values well there and misses at the ends.</p>
  <p>With TD the target itself depends on θ. The usual update ignores that dependence, which is why it is called <b>semi-gradient</b>. For control, the same idea gives semi-gradient SARSA with Q̂(s, a; θ).</p>`},
 {id:"average",ch:4,no:"",title:"Average reward",sub:"control with approximation, for tasks that never end",fig:{kind:"avgrew"},figno:"",figtitle:"γ rescales, it never re-ranks",notes:[["on-policy-control-with-function-approximation","On-Policy Control"]],html:`
  <p class="lead">Swap V̂ for Q̂ and the approximate update becomes semi-gradient SARSA. For tasks that never end, the note replaces discounting with the average reward.</p>
  <div class="eq">R(π) = Σ<sub>s</sub> μ<sub>π</sub>(s) Σ<sub>a</sub> π(a|s) R(s, a)<br>δ<sub>t</sub> = r<sub>t+1</sub> − R̂ + Q̂(s<sub>t+1</sub>, a<sub>t+1</sub>) − Q̂(s<sub>t</sub>, a<sub>t</sub>)</div>
  <p>Semi-gradient SARSA evaluates every action to act greedily, so it suits small action sets. With ε-greedy on top, it is the approximate version of page 3.4.</p>
  <p>The average reward is the long-run reward per step. It assumes an ergodic MDP, where long-run time in each state doesn't depend on the start. The two-state chain from page 2.2 spends 75% of its time in s₁ and earns 8.75 per step.</p>
  <p>The note proves that the μ-weighted discounted value equals R(π)/(1 − γ). The bars check it exactly: at γ = 0.9, 0.75 × 89.02 + 0.25 × 82.93 = 87.5 = 8.75 / 0.1. So γ only rescales; it never changes which policy ranks higher.</p>`},
 {id:"offpolicy",ch:4,no:"",title:"Two off-policy problems",sub:"off-policy control with approximation",fig:{kind:"asplit"},figno:"",figtitle:"Lower TD error, wrong values",notes:[["off-policy-control-with-function-approximation","Off-Policy Control"]],html:`
  <p class="lead">Off-policy learning with function approximation has two problems. Mismatched targets are fixed by importance ratios. Mismatched update distributions are not.</p>
  <p>Q-learning needs no ratio for the first: its max is the target policy's action, so the behaviour policy never enters the target. The second is the problem behind the deadly triad.</p>
  <p>An obvious fix is true gradient descent on some error instead of semi-gradient TD. On which error? The note's A-split: from A go to B or C at random (reward 0); B ends with +1, C with 0. The true values are (½, 1, 0).</p>
  <p>Minimising the squared TD error converges to (½, ¾, ¼). It has a <i>lower</i> TD error than the true values, and the wrong answer. Semi-gradient TD finds the truth. Minimising the Bellman error instead needs two independent next states (double sampling), and its minimiser can't be learned from data at all.</p>`},
 {id:"learnable",ch:4,no:"",title:"What the data can't tell you",sub:"learnability of RL objectives",fig:{kind:"learn"},figno:"",figtitle:"Same stream, two different MRPs",notes:[["learnability-of-rl-objectives","Learnability"]],html:`
  <p class="lead">Some objectives can't be pinned down even with infinite data, because two different MRPs can produce exactly the same observations.</p>
  <p>The note's example: MRP A has one state that pays 0 or 2 at random. MRP B has two states, one paying 0 and one paying 2, switching at random. With one shared feature, the agent sees the same stream of 0s and 2s from both.</p>
  <p>The value error VE differs: at θ = 1 it is 0 for A and 1 for B, so VE isn't learnable. The return error RE is, and it equals VE plus a variance term that doesn't depend on θ, so the minimiser is the same. That is why Monte Carlo methods still find the VE-best θ.</p>
  <div class="eq">RE(θ) = VE(θ) + E[ ( G<sub>t</sub> − V<sub>π</sub>(s<sub>t</sub>) )² ]</div>
  <p>The Bellman error fares worse: neither its value nor its minimiser is learnable. The projected Bellman error (the TD fixed point) and the TD error are learnable, but they have different minimisers.</p>`},
 {id:"triad",ch:4,no:"4.2",title:"The deadly triad",sub:"three good ideas that diverge together",fig:{kind:"triad"},figno:"Exhibit 4.2",figtitle:"Values explode when all three meet",notes:[["the-deadly-triad","The Deadly Triad"],["off-policy-control-with-function-approximation","Off-Policy Control"],["learnability-of-rl-objectives","Learnability"]],html:`
  <p class="lead">Function approximation, bootstrapping and off-policy training are each useful. Together they can make value estimates blow up.</p>
  <p>The note's example has six states, seven weights and zero reward everywhere, so every true value is 0 and θ = 0 would fit it exactly. The behaviour policy spreads visits over all six states; the target policy always goes to s₆.</p>
  <p>Watch the ratchet (α = 0.1, all weights 1). Each update from an upper state toward s₆ raises θ₇, which raises s₆'s estimate, which raises the next target: θ₇ goes 1.294, 1.704, 2.276, 3.074, 4.188. The one update from s₆ to itself pulls it back only to about 4.08.</p>
  <p>Over 1,000 expected sweeps (α = 0.01) the largest estimate passes 10<sup>12</sup>. Remove any one leg, with a table instead of shared features, Monte Carlo targets instead of bootstrapping, or on-policy weighting, and it stays bounded.</p>`},
 {id:"dqn",ch:4,no:"4.3",title:"Deep Q-learning",sub:"two tricks that keep it stable",fig:{kind:"dqn"},figno:"Exhibit 4.3",figtitle:"Replay buffer and target network",notes:[["deep-q-learning","Deep Q-Learning"]],html:`
  <p class="lead">Deep Q-learning (DQN) replaces the Q-table with a neural network that takes a state and outputs a value for every action.</p>
  <p>Trained naively it is unstable: consecutive moves are nearly identical, and the target keeps shifting because it comes from the network being trained. DQN adds two fixes:</p>
  <ul class="l"><li><b>Experience replay.</b> Store moves in a buffer and train on random mini-batches. This breaks up runs of similar moves and reuses data.</li><li><b>A target network.</b> Compute targets with a frozen copy θ⁻ and refresh it only now and then, so the goal holds still between copies.</li></ul>
  <div class="eq">δ = r + γ max<sub>a′</sub> Q(s′, a′; <span class="hl">θ⁻</span>) − Q(s, a; θ)</div>
  <p class="note">In the chart the target (light blue) moves in steps at each copy and the online estimate (gold) chases it. The note also flags a sign trap: with loss (target − prediction)², the update is +α δ ∇Q.</p>`},
 {id:"doubleq",ch:4,no:"4.4",title:"Double Q-learning",sub:"the max is an optimist",fig:{kind:"doubleq"},figno:"Exhibit 4.4",figtitle:"Max of noise is not zero",notes:[["double-q-learning","Double Q-Learning"]],html:`
  <p class="lead">The max of noisy estimates is biased upward, even when each estimate on its own is unbiased.</p>
  <p>Here every action is truly worth 0 and each estimate has noise between −1 and +1. The largest of m estimates averages (m − 1)/(m + 1): 0.6 with four actions and 0.82 with ten. Q-learning's max builds this optimism into every target.</p>
  <p>The fix is to keep two estimates. Let Qᴬ choose the action and Qᴮ score it. Qᴮ's noise has nothing to do with Qᴬ's choice, so the score is unbiased.</p>
  <div class="eq">Y = r + γ Q<sup>B</sup>( s′, argmax<sub>a′</sub> Q<sup>A</sup>(s′, a′) )</div>
  <p>Double DQN reuses the target network as the second estimator.</p>
  ${chk("With 10 actions and noise uniform in [−1, 1], how much does the plain max overestimate on average?","About 0.82, from (m − 1)/(m + 1) = 9/11.")}`},

 {id:"pg",ch:5,no:"5.1",title:"Policy gradients",sub:"skip the values, tune the policy",fig:{kind:"pg"},figno:"Exhibit 5.1",figtitle:"Why REINFORCE divides by π(a)",notes:[["policy-gradients","Policy Gradients"]],html:`
  <p class="lead">Instead of learning values and acting greedily, policy-gradient methods adjust the policy's parameters θ directly, uphill on expected return.</p>
  <p>They handle continuous actions, can represent stochastic policies, and change probabilities smoothly as θ moves, unlike ε-greedy, which jumps.</p>
  <div class="eq">θ ← θ + α G<sub>t</sub> ∇ ln π(a<sub>t</sub>|s<sub>t</sub>; θ) = θ + α G<sub>t</sub> ∇π(a<sub>t</sub>|s<sub>t</sub>) / <span class="hl">π(a<sub>t</sub>|s<sub>t</sub>)</span><small>REINFORCE. The policy gradient theorem makes this possible without differentiating the state distribution.</small></div>
  <p>The division by π(a) is what makes it fair. Common actions are sampled more often, so without it they get pushed up just for being common. On the right, arms pay 0.2, 0.5 and 0.8, and the policy starts mostly on the 0.5 arm. REINFORCE finds the 0.8 arm; the version without 1/π locks onto the 0.5 arm.</p>`},
 {id:"ac",ch:5,no:"5.2",title:"Actor and critic",sub:"a learned critic cuts the noise",fig:{kind:"ac"},figno:"Exhibit 5.2",figtitle:"A tighter learning signal",notes:[["actor-critic","Actor-Critic Framework"]],html:`
  <p class="lead">REINFORCE is a Monte Carlo method: its signal G<sub>t</sub> adds up the noise of every later step. Actor-critic swaps it for the critic's TD error.</p>
  <div class="eq">δ<sub>t</sub> = r<sub>t+1</sub> + γ V(s<sub>t+1</sub>) − V(s<sub>t</sub>)&nbsp;&nbsp;&nbsp; θ ← θ + α <span class="hl">δ<sub>t</sub></span> ∇ ln π(a<sub>t</sub>|s<sub>t</sub>)</div>
  <p>The critic learns the value of the actor's current policy, not the optimal one. The actor moves toward actions that turned out better than the critic expected.</p>
  <p>On a 7-cell corridor with noisy step rewards (20 runs, same step size for both), the TD error's spread is about half the return's, and actor-critic settles on a shorter path to the goal.</p>
  <p class="note">The note counts TRPO and PPO as actor-critic methods too. The corridor is an illustrative test, not from the note.</p>`},
 {id:"kl",ch:5,no:"5.3",title:"KL divergence",sub:"how far apart two distributions are",fig:{kind:"kl"},figno:"Exhibit 5.3",figtitle:"Two directions, two answers",notes:[["kl-divergence","KL Divergence"]],html:`
  <p class="lead">KL divergence measures how different two distributions are. The note builds it from importance sampling: it is the average log of the probability ratio.</p>
  <div class="eq">D<sub>KL</sub>(p ‖ q) = E<sub>x∼p</sub>[ log p(x) / q(x) ]</div>
  <p>It isn't symmetric, and the direction changes the answer. Fit one Gaussian to a target with two bumps:</p>
  <ul class="l"><li><span class="key">Reverse KL(q‖p)</span> is mode-seeking. Mass where the target is empty is punished hard, so the fit locks onto one bump.</li><li><b>Forward KL(p‖q)</b> (dashed) is mean-seeking; it equals maximum likelihood. Missing a bump is punished, so the fit spreads over both, empty middle included.</li></ul>
  <p>RL usually uses the reverse direction, because we can sample from our policy. Supervised learning uses the forward one, because we only have samples of data. Keeping KL between old and new policies small also keeps importance ratios near 1, the idea behind TRPO and PPO.</p>`},
 {id:"trpo",ch:5,no:"5.4",title:"TRPO: a trust region",sub:"limit how far behaviour moves",fig:{kind:"trpo"},figno:"Exhibit 5.4",figtitle:"Same KL budget, different step",notes:[["trpo","TRPO"],["conjugate-gradient-method","Conjugate Gradient"]],html:`
  <p class="lead">In RL the agent collects its own data, so one bad update can poison everything after it. TRPO takes the largest step that keeps the average KL to the old policy under δ.</p>
  <div class="eq">max<sub>θ</sub> E[ π<sub>θ</sub>(a|s) / π<sub>old</sub>(a|s) · A(s,a) ]&nbsp; s.t.&nbsp; E[ D<sub>KL</sub>(π<sub>old</sub> ‖ π<sub>θ</sub>) ] ≤ δ</div>
  <p>Expanding the KL to second order gives an ellipse in parameter space, shaped by the Fisher matrix. The best step inside it is the natural gradient, then a line search halves the step until the exact KL is under δ and the objective improves.</p>
  <p>On the right, a three-action policy with two free parameters. While the policy is uncertain the ellipse is small. As it becomes nearly certain, the same budget allows a much longer step in θ. Equal parameter steps are not equal changes in behaviour.</p>
  <p class="note">A real network's Fisher matrix is too big to build (the note's 8-100-100-2 example has 11,202 parameters, so over 125 million entries). TRPO finds the step with the conjugate gradient method, which needs only matrix-vector products.</p>`},
 {id:"cg",ch:5,no:"",title:"The conjugate gradient method",sub:"how TRPO solves Hx = g without H",fig:{kind:"cg"},figno:"",figtitle:"Two steps instead of hundreds",notes:[["conjugate-gradient-method","Conjugate Gradient"],["trpo","TRPO"]],html:`
  <p class="lead">TRPO needs H⁻¹g, but H is far too big to build or invert. Conjugate gradient solves Hx = g using only products Hv.</p>
  <p>Solving Ax = b for a symmetric positive-definite A is the same as minimising ½xᵀAx − bᵀx. Gradient descent with a fixed step crawls. Steepest descent picks the best step each time, but each new step is at right angles to the last, so it zigzags down a long valley.</p>
  <p>Conjugate gradient picks directions that are orthogonal under A, so no step undoes progress an earlier step made. In n dimensions it finishes in at most n steps.</p>
  <div class="eq">α<sub>k</sub> = r<sub>k</sub>ᵀr<sub>k</sub> / p<sub>k</sub>ᵀA p<sub>k</sub>,&nbsp; p<sub>k+1</sub> = r<sub>k+1</sub> + β<sub>k</sub> p<sub>k</sub>,&nbsp; β<sub>k</sub> = r<sub>k+1</sub>ᵀr<sub>k+1</sub> / r<sub>k</sub>ᵀr<sub>k</sub></div>
  <p>On this 2-D bowl, gradient descent takes 202 steps, steepest descent 59 and conjugate gradient 2. The note's own example: 93, 35 and 2.</p>`},
 {id:"ppo",ch:5,no:"5.5",title:"PPO: clip the ratio",sub:"TRPO's idea, first-order and simple",fig:{kind:"ppo"},figno:"Exhibit 5.5",figtitle:"The note's four cases",notes:[["ppo","PPO"]],html:`
  <p class="lead">PPO keeps the probability-ratio objective but clips the ratio φ to [1 − ε, 1 + ε], so it can take several cheap gradient steps on one batch without straying far.</p>
  <div class="eq">L<sup>CLIP</sup> = E[ min( φ<sub>t</sub>A<sub>t</sub>,&nbsp; clip(φ<sub>t</sub>, 1−ε, 1+ε) A<sub>t</sub> ) ]</div>
  <table class="t"><tr><th>φ</th><th>A</th><th class="num">unclipped</th><th class="num">clipped</th><th class="num">used</th><th>gradient</th></tr>
  <tr><td>1.5</td><td>+2</td><td class="num">3</td><td class="num">2.4</td><td class="num">2.4</td><td>no</td></tr>
  <tr><td>1.5</td><td>−2</td><td class="num">−3</td><td class="num">−2.4</td><td class="num">−3</td><td>yes</td></tr>
  <tr><td>0.6</td><td>+2</td><td class="num">1.2</td><td class="num">1.6</td><td class="num">1.2</td><td>yes</td></tr>
  <tr><td>0.6</td><td>−2</td><td class="num">−1.2</td><td class="num">−1.6</td><td class="num">−1.6</td><td>no</td></tr></table>
  <p>With ε = 0.2, the min makes PPO pessimistic. Clipping only stops a sample from pushing further in a direction it has already moved enough. When the ratio has moved the wrong way, the full gradient stays, so the mistake gets corrected.</p>`},
 {id:"grpo",ch:5,no:"5.6",title:"GRPO: grade on a curve",sub:"PPO for language models, without a critic",fig:{kind:"grpo"},figno:"Exhibit 5.6",figtitle:"Each answer scored against its group",notes:[["grpo","GRPO"]],html:`
  <p class="lead">GRPO samples a group of answers to the same prompt and scores each one against the group. That relative score is the advantage; no value network needed.</p>
  <div class="eq">Â<sub>i</sub> = ( r<sub>i</sub> − mean(r) ) / std(r)</div>
  <p>For language models a critic is large and hard to train from one reward at the end of an answer. GRPO drops it. Every token in answer i gets Â<sub>i</sub>, PPO's clipped objective does the rest, and a KL penalty toward the reference (SFT) model stops the policy drifting too far.</p>
  <p>On the right, one prompt with four hidden ways of answering, right 10%, 30%, 60% and 90% of the time. Each round samples 8 answers. A right answer in a mostly wrong group gets a big positive advantage; if all 8 agree, the std is 0 and there is no signal. Over 40 rounds the chance of a right answer climbs from 35% to 78%.</p>
  <p class="note">A simulation of the idea, not a language model. The note also covers process supervision, where each reasoning step gets its own normalised score.</p>
  ${chk("A group of four answers gets rewards [1, 0, 0, 1]. What are the advantages?","Mean 0.5 and std 0.5, so [+1, −1, −1, +1].")}`},

 {id:"ddpg",ch:6,no:"6.1",title:"DPG and DDPG",sub:"follow the critic's slope",fig:{kind:"ddpg"},figno:"Exhibit 6.1",figtitle:"The actor slides up the critic",notes:[["ddpg","DPG & DDPG"]],html:`
  <p class="lead">With continuous actions you can't take a max over every action at every step. Deterministic policy gradient (DPG) uses a deterministic actor that slides uphill on the critic instead.</p>
  <div class="eq">∇<sub>θ</sub>J = E<sub>s</sub>[ ∇<sub>a</sub>Q(s, a)|<sub>a = ρ(s)</sub> · ∇<sub>θ</sub>ρ(s; θ) ]</div>
  <p>The gradient needs an average over states only, not over actions, so it needs far fewer samples. Exploration comes from noise added to the actions, which makes it off-policy.</p>
  <p>On the right, colour is the critic's Q(s, a) and the dashed line is the best action in each state. The actor starts flat and follows the white arrows, ∂Q/∂a, until it sits on the ridge.</p>
  <p>DDPG is DPG plus DQN's tools: a replay buffer, target networks updated softly (θ⁻ ← τθ + (1 − τ)θ⁻) and exploration noise.</p>`},
 {id:"td3",ch:6,no:"6.2",title:"TD3: trust the lower critic",sub:"twin critics, delayed updates, smoothed targets",fig:{kind:"td3"},figno:"Exhibit 6.2",figtitle:"The actor finds the critic's mistakes",notes:[["td3","TD3"],["double-q-learning","Double Q-Learning"]],html:`
  <p class="lead">An actor that maximises an imperfect critic finds the critic's mistakes, especially the optimistic ones. TD3 is built to resist that.</p>
  <p>The note's point: here overestimation comes from optimisation, not a max operator. And Double DQN's fix fails, because the online and target critics change slowly and share their errors.</p>
  <ul class="l"><li><b>Twin critics:</b> train two and use the smaller target. Underestimating is safer, because undervalued actions don't get chosen.</li><li><b>Delayed updates:</b> update the actor and targets every d = 2 critic updates.</li><li><b>Target smoothing:</b> add a little clipped noise to the target action, so narrow false peaks don't count.</li></ul>
  <div class="eq">y = r + γ min<sub>i=1,2</sub> Q<sub>i</sub>(s′, ã′)</div>
  <p>On the right, each round draws two noisy critics of the same true Q. An actor using critic 1 alone overestimates by about 0.16 on average; using the minimum, about 0.03.</p>`},
 {id:"reparam",ch:6,no:"6.3",title:"The reparameterization trick",sub:"move the randomness out of the way",fig:{kind:"reparam"},figno:"Exhibit 6.3",figtitle:"Two unbiased estimators, one tight",notes:[["reparameterization-trick","Reparameterization Trick"]],html:`
  <p class="lead">To differentiate an expectation over a distribution that depends on θ, write each sample as fixed noise passed through a function of θ.</p>
  <div class="eq">z = μ(θ) + σ(θ) ε,&nbsp; ε ∼ N(0, 1)&nbsp;&nbsp;⇒&nbsp;&nbsp;∇<sub>θ</sub>E[f(z)] = E<sub>ε</sub>[ ∇<sub>θ</sub> f(μ + σε) ]</div>
  <p>The alternative, the score-function (log-derivative) estimator, is also unbiased but noisy. On the right, both estimate d/dμ E[z²] for z ∼ N(1, 1), whose true value is 2. Score-function samples spread about √30 ≈ 5.5; reparameterised ones spread 2.</p>
  <p>To get within ±5% you need about 3,000 samples one way and 400 the other. SAC, next, depends on this trick.</p>`},
 {id:"sac",ch:6,no:"6.4",title:"Soft Actor-Critic",sub:"reward plus entropy",fig:{kind:"sac"},figno:"Exhibit 6.4",figtitle:"Temperature decides how wide to stay",notes:[["sac","Soft Actor-Critic"],["kl-divergence","KL Divergence"]],html:`
  <p class="lead">SAC trains a stochastic Gaussian policy to maximise reward plus α times its entropy. The bonus keeps it exploring and keeps more than one good behaviour alive.</p>
  <div class="eq">π ∝ exp( Q(s, a) / α )&nbsp;&nbsp;&nbsp; J<sub>π</sub> = E[ α log π(a|s) − Q(s, a) ],&nbsp; a = μ + σε</div>
  <p>Each policy update fits the Gaussian to exp(Q/α) by KL, using the reparameterization trick so the gradient flows through Q. On the right, Q has peaks of 1.0 and 0.9. At high α the best Gaussian spreads across both. Below about α = 0.2 it commits to the higher peak.</p>
  <p>Too large an α gives a near-uniform policy; too small, an early collapse onto one action. SAC can tune α automatically to hold entropy near a target, and it borrows TD3's twin critics.</p>
  ${chk("SAC's automatic tuning sees entropy fall below its target. What happens to α?","It rises, which raises the entropy bonus until the policy spreads out again.")}`},

 {id:"constrained",ch:7,no:"",title:"Constrained MDPs",sub:"a budget, a price and a saddle point",fig:{kind:"cmdp2"},figno:"",figtitle:"Descent-ascent circles the saddle",notes:[["constrained-mdps","Constrained MDPs"]],html:`
  <p class="lead">A constrained MDP maximises reward while keeping expected cost under a limit. Lagrangian relaxation turns the limit into a price λ, and the problem into a game between the policy and the price.</p>
  <div class="eq">L(π, λ) = J<sub>R</sub>(π) − λ ( J<sub>C</sub>(π) − l ),&nbsp; λ ≥ 0</div>
  <p>For a fixed λ it is an ordinary MDP with reward r − λc. So training alternates: improve the policy at the current price, then raise λ when over budget and lower it when under.</p>
  <p>The note's two-state example (γ = 0, limit 0): from s₁, staying is safe and pays 0; moving to s₂ pays 1 but costs 1. Starting in s₁ 80% of the time, the best policy stays with probability 0.75 and earns 0.4. The best deterministic policy earns only 0.2. The optimum is random.</p>
  <p>On the right, descent-ascent on (p, λ) circles the saddle instead of settling, while the running average of p converges to 0.75. Fixing λ at its best value, 1, doesn't help: the Lagrangian is then flat in p and accepts policies that break the limit.</p>`},
 {id:"cmdp",ch:7,no:"",title:"The PID Lagrangian",sub:"a steadier hand on the price",fig:{kind:"cmdp"},figno:"",figtitle:"Plain λ overshoots, PID damps",notes:[["pid-lagrangian","PID Lagrangian"],["constrained-mdps","Constrained MDPs"]],html:`
  <p class="lead">Raising λ by gradient ascent is an integral-only controller: λ is a scaled running sum of past constraint violations. Integral-only control overshoots and oscillates.</p>
  <div class="eq">λ ← [ K<sub>P</sub> e<sub>t</sub> + K<sub>I</sub> Σ<sub>τ≤t</sub> e<sub>τ</sub> + K<sub>D</sub> ( J<sub>C,t</sub> − J<sub>C,t−1</sub> )<sub>+</sub> ]<sub>+</sub>,&nbsp; e<sub>t</sub> = J<sub>C,t</sub> − l</div>
  <p>The PID Lagrangian adds a proportional term, which reacts to the current violation, and a derivative term, which reacts only while cost is rising. Both damp the swing.</p>
  <p>In this toy loop, plain λ lets cost peak at 4.7 and cross the limit four times; PID peaks at 2.4 and crosses once.</p>
  <p>The note also rescales the update so that λ = 1 means the reward and cost gradients have equal size, which makes the gains independent of the reward's scale.</p>
  <p class="note">Illustrative dynamics; the note gives no gains.</p>`},
 {id:"cpo",ch:7,no:"",title:"Constrained Policy Optimization",sub:"stay within the limit at every step",fig:{kind:"cpo"},figno:"",figtitle:"Three cases of one step",notes:[["cpo","CPO"],["trpo","TRPO"]],html:`
  <p class="lead">Lagrangian methods are only feasible at the saddle point, so training can break the limit along the way. CPO enforces the cost limit inside every TRPO-style step.</p>
  <p>Linearise reward and cost around the current policy and keep the KL trust region. Each step solves: maximise gᵀx subject to c + bᵀx ≤ 0 and ½xᵀHx ≤ δ, where c is how far the current cost sits from the limit. With one constraint the dual has a closed form.</p>
  <p>Three cases play on the right. If the limit is far away, the step is plain TRPO. If the limit cuts the trust region, the step bends along it. If no step in the region is feasible, CPO takes a recovery step straight down the cost gradient, which restores feasibility but doesn't try to improve reward.</p>
  <div class="eq">θ* = θ<sub>k</sub> − √( 2δ / bᵀH⁻¹b ) · H⁻¹b<small>the recovery step</small></div>
  <p class="note">The figure uses H = I, so the trust region is a circle. The note follows its own form of the dual, which it says differs from the paper's by a factor of 2.</p>`},
 {id:"nnverify",ch:7,no:"",title:"Verifying a network",sub:"sound, but not complete",fig:{kind:"nnv"},figno:"",figtitle:"The bound is safe but loose",notes:[["nn-verification","NN Verification"]],html:`
  <p class="lead">You can't test a network on every input, so verification tries to prove a property over a whole set: if the input is in this box, the output meets the spec.</p>
  <p>Exact methods treat each ReLU as an on/off case and search them with SMT or MILP solvers; the cases grow exponentially. Abstract interpretation instead pushes the whole box through the network: an affine layer maps an interval to an interval, and a ReLU clips it at zero.</p>
  <p>That is sound: the bound always contains every true output. It isn't complete: it ignores how neurons depend on each other, so it can be too wide. On the right the spec is y ≥ −0.2. Small boxes verify. Near half-width 0.5 the bound crosses the line while no actual output does, so the verifier says “unknown”. Larger boxes contain a real counterexample.</p>
  <p>Tighter domains, such as zonotopes and polyhedra, keep some of those dependencies.</p>
  ${chk("Does “unknown” mean the property is false?","No. Only a concrete counterexample shows that. Unknown means the bound was too loose to decide.")}`},
 {id:"drlverify",ch:7,no:"",title:"Verifying an agent",sub:"why RL makes it harder",fig:{kind:"drlv"},figno:"",figtitle:"Bounds widen with every step",notes:[["drl-verification","DRL Verification"]],html:`
  <p class="lead">An RL agent runs its network at every step, and each output becomes part of its next input. Checking t steps of an n-neuron network is like checking one network with t·n neurons.</p>
  <p>That brings three new problems: the cases to search grow like 2<sup>t·n</sup>, the properties are about whole trajectories, and the environment is random, so guarantees have to hold over distributions.</p>
  <p>On the right, a controller with two ReLU neurons nudges a position x back toward a safe point. Forty sampled runs stay well inside. The interval bound, unrolled step by step, loses the link between x and the controller's response, widens every step, and reaches the crash zone within five steps though no run comes close.</p>
  <p class="note">An illustrative system. The note points to the author's survey of methods that do better.</p>`},
 {id:"ope",ch:8,no:"",title:"Off-policy evaluation",sub:"scoring a policy from someone else's logs",fig:{kind:"ope"},figno:"",figtitle:"Four estimators, one truth",notes:[["off-policy-evaluation","Off-Policy Evaluation"],["importance-sampling","Importance Sampling"]],html:`
  <p class="lead">Before deploying a new policy you often want its value from logs collected by the old one. The note treats this as causal inference and compares four estimators.</p>
  <ul class="l"><li><b>IS:</b> reweight each logged reward by π<sub>e</sub>/π<sub>b</sub>. Unbiased, high variance.</li><li><b>Weighted IS:</b> divide by the sum of weights instead of n. Slightly biased, far steadier.</li><li><b>Direct method:</b> fit a model Q̂ and read off its value. Low variance, biased if the model is wrong.</li><li><b>Doubly robust:</b> the model plus an IS correction of its error. Right if either the model or the logging policy is right.</li></ul>
  <div class="eq">Ĵ<sub>DR</sub> = (1/n) Σ<sub>i</sub> [ ρ<sub>i</sub> ( r<sub>i</sub> − Q̂(s<sub>i</sub>, a<sub>i</sub>) ) + Q̂(s<sub>i</sub>, π<sub>e</sub>) ]</div>
  <p>On the right, logs come from a uniform policy over 5 arms and the target always pulls arm 3 (true value 0.8). The model is off by 0.2, so the direct method sits at 0.6. Doubly robust uses the same model and still lands near 0.8.</p>
  <p class="note">In MDPs the product of weights blows up with the horizon (page 3.5), so the note moves to ratios of state distributions and the DRL estimator.</p>`},
 {id:"iql",ch:8,no:"7.2",title:"Offline RL: stay inside the data",sub:"Implicit Q-Learning",fig:{kind:"iql"},figno:"Exhibit 7.2",figtitle:"An upper expectile, not a max",notes:[["implicit-q-learning","Implicit Q-Learning"],["off-policy-evaluation","Off-Policy Evaluation"]],html:`
  <p class="lead">Offline RL learns from a fixed dataset with no new tries. The danger is the max: it picks actions the data never covered, whose values nothing can correct.</p>
  <p>Implicit Q-learning never asks about unseen actions. It fits V(s) as an upper expectile of Q over the actions in the data, then backs up r + γV(s′).</p>
  <div class="eq">L<sub>τ</sub>(u) = | τ − 1(u &lt; 0) | · u²,&nbsp;&nbsp; u = Q(s, a) − V(s)</div>
  <p>τ = 0.5 gives the plain average, like SARSA on the data. As τ approaches 1, the expectile moves toward the best action in the data, like Q-learning, but it never reaches the over-valued action that isn't there.</p>
  <p>The policy is then extracted by advantage-weighted regression: imitate the data's actions, weighted by exp(A/β).</p>
  <p class="note">The note's figure uses τ = 0.9. Off-policy evaluation, a neighbouring note, asks the related question of scoring a policy from logs alone.</p>`},
 {id:"successor",ch:8,no:"",title:"Successor features",sub:"reuse old policies on a new task",fig:{kind:"sf"},figno:"",figtitle:"A new task is a new w",notes:[["successor-features","Successor Features"]],html:`
  <p class="lead">If reward is linear in some features, r = φᵀw, then a policy's Q-value splits into what it collects, ψ, and what that is worth, w.</p>
  <div class="eq">Q<sup>π</sup>(s, a) = ψ<sup>π</sup>(s, a)ᵀ w</div>
  <p>ψ depends only on the dynamics and the policy. It has its own Bellman equation and is learned by TD. w depends only on the task. The note's example: ψ = (1, 0.73, 0.9, 0, 0, 1.47) and w = (2, 1, 5, 0, 0, 3) give Q = 11.64.</p>
  <p>Give the agent a new task and only w changes: every stored policy is re-scored by a dot product, with no new learning. Generalised policy improvement (GPI) then acts greedily on the best of them, and is guaranteed to do no worse than any one.</p>
  <p class="note">Policies 2 and 3 and the new tasks are illustrative. The note bounds the remaining gap and lists the limits: rewards must be linear, and the result is only as good as the stored policies.</p>`},
 {id:"distill",ch:8,no:"",title:"Policy distillation",sub:"learn from a teacher, then outgrow it",fig:{kind:"distill"},figno:"",figtitle:"A fast start, then past the teacher",notes:[["policy-distillation","Policy Distillation"]],html:`
  <p class="lead">Distillation trains a student to match a teacher's action probabilities, not its Q-values. Q-values are unbounded and unstable to regress; probabilities are bounded and keep the information in near-ties.</p>
  <div class="eq">L = E[ L<sub>RL</sub> + Σ<sub>t</sub> λ<sub>t</sub> H(π<sub>E</sub>, π<sub>θ</sub>) ]<small>kickstarting: the usual RL loss plus a weighted cross-entropy to the teacher</small></div>
  <p>The teacher's term works like a regulariser: it shapes the start of learning but shouldn't decide where it ends.</p>
  <p>On the right, a 20-armed bandit with a good-but-not-best teacher (expected reward 0.635). From scratch, learning starts slowly. A fixed weight learns fast but stays pinned near the teacher. A decaying weight gets the fast start and then keeps improving past the teacher, to about 0.84.</p>
  <p class="note">An illustrative bandit. The note's examples (Actor-Mimic, and kickstarting tuned by population-based training) use Atari and DMLab.</p>`},
 {id:"alphazero",ch:8,no:"7.3",title:"AlphaZero: search, then learn from it",sub:"PUCT and self-play",fig:{kind:"mcts"},figno:"Exhibit 7.3",figtitle:"Visits move from the prior to the winner",notes:[["alphazero","AlphaZero (chess)"]],html:`
  <p class="lead">AlphaZero replaces hand-written evaluation with one network that outputs move probabilities p and a value v, and uses it to guide a tree search.</p>
  <div class="eq">a = argmax<sub>a</sub> [ Q(s,a) + c · P(s,a) · √N(s) / (1 + N(s,a)) ]</div>
  <p>Each simulation picks moves by this rule. Q favours moves that have done well; the second term favours moves the network likes that haven't been tried much. Leaves are scored by the network instead of random playouts.</p>
  <p>On the right, the network's prior favours move 1, so early simulations go there. As evidence arrives, visits shift to move 3, which actually wins most often. After 800 simulations, the number the note uses, the visit counts are the improved policy.</p>
  <p>Self-play trains the network to match those visit counts and the game's result. The search is distilled into the network, which makes the next search stronger.</p>
  <p class="note">A toy search at one position; c = 1.5 is chosen for the demo (the note gives no value).</p>`},
 {id:"cem",ch:8,no:"7.4",title:"The cross-entropy method",sub:"sample, keep the best, refit",fig:{kind:"cem"},figno:"Exhibit 7.4",figtitle:"The waterline rises",notes:[["cem","Cross-Entropy Method"]],html:`
  <p class="lead">The cross-entropy method (CEM) searches by sampling: draw candidates from a Gaussian, keep the top few, refit the Gaussian to them, repeat.</p>
  <p>The note frames it as estimating a rare event, “value above γ”, and raising γ each round. The best samples tell you where to look next, and the cut-off γ<sub>t</sub> rises like a waterline.</p>
  <p>On the right, 80 samples a round, the best 12 kept, with smoothing. The search starts between a broad decoy (0.7) and the true peak (1.0), and closes in on the peak within five rounds.</p>
  <p>It needs no gradients, which is why it is used to plan actions at run time. Its failure mode: refit too aggressively and it can lock onto the decoy.</p>`},

 {id:"backprop",ch:9,no:"",title:"Backpropagation",sub:"one pass forward, one pass back",fig:{kind:"backprop"},figno:"",figtitle:"Blame flows back, gated by each neuron",notes:[["backpropagation","Backpropagation"],["deep-q-learning","Deep Q-Learning"]],html:`
  <p class="lead">Training needs the gradient of the loss for every weight. Backpropagation gets all of them from one forward pass and one backward pass, by reusing a per-neuron error signal δ.</p>
  <div class="eq">δ<sup>(l)</sup> = (W<sup>(l+1)</sup>)ᵀ δ<sup>(l+1)</sup> ⊙ σ′(z<sup>(l)</sup>),&nbsp;&nbsp; ∂BE / ∂w<sub>ij</sub><sup>(l)</sup> = δ<sub>i</sub><sup>(l)</sup> g<sub>j</sub><sup>(l−1)</sup></div>
  <p>The note builds it on a DQN head with the Bellman error as the loss. Only the action that was taken has an error, so the other output's δ is zero and sends no blame back.</p>
  <p>δ is the blame arriving from above, scaled by how sensitive the neuron is. On the right, h₃ is saturated (its sigmoid sits near 1): it receives −0.40 of blame and passes on only −0.004. A weight's gradient is its neuron's δ times its incoming activation, so the weight from x₁ = 0.9 gets a gradient 4.5 times the one from x₂ = 0.2.</p>
  <p>One step with α = 0.1 moves Q(s, a₁) from 1.10 to 1.34 and halves the Bellman error. The saving isn't from skipping the chain rule but from organising it: each piece is computed once and reused.</p>
  <p class="note">The network and its numbers are ours (the note's diagram has no values); the arithmetic is real.</p>`},
 {id:"transformer",ch:9,no:"",title:"Attention and the Transformer",sub:"every word looks at the others",fig:{kind:"attn"},figno:"",figtitle:"A head that looks one word back",notes:[["transformer","Transformer"]],html:`
  <p class="lead">A transformer layer lets each token's vector pull in information from the others (attention), then reshape itself (an MLP). Stacked, this makes each word's meaning depend on its context.</p>
  <div class="eq">A = softmax( QKᵀ / √d<sub>k</sub> ),&nbsp;&nbsp; O = AV</div>
  <p>Queries ask, keys answer, and their scaled, softmaxed dot products say how much each word takes from each other word. For next-word training, future positions get −∞ before the softmax. The output is added back to the input (a residual), and several heads run side by side at the same total cost.</p>
  <p>Order comes from sinusoidal position encodings, which make relative offsets a fixed linear map. On the right is the note's example sentence with one head built by hand: its query is each position rotated back by one, so every word attends mostly to the word before it (“building” to “tallest”). Turning up the scale β sharpens it.</p>
  <p>The last phase shows the note's warning: zeroing future positions <i>after</i> the softmax leaves rows that no longer sum to 1.</p>
  <p class="note">Hand-built weights, real arithmetic. The note gives no head count or model width. Language-model RL (GRPO) and the PFN pages both run on this architecture.</p>`},
 {id:"bayes",ch:9,no:"",title:"Bayes' rule for distributions",sub:"the unknown as a distribution",fig:{kind:"bayes"},figno:"",figtitle:"Prior times likelihood",notes:[["bayes-theorem-for-probability-distributions","Bayes' for Distributions"]],html:`
  <p class="lead">Treat an unknown proportion θ as a distribution, not a fixed number. Multiply the prior by the likelihood and you get the posterior.</p>
  <div class="eq">π(θ | X) ∝ p(X | θ) π(θ)&nbsp;&nbsp;⇒&nbsp;&nbsp; θ | X ~ Beta(α + S, β + n − S)</div>
  <p>The note's question: what share of students at a university are women? With a Beta prior and yes/no data, the posterior is again a Beta with the counts added, so no integral is needed. That is conjugacy.</p>
  <p>On the right, the first three draws are all women. The maximum-likelihood estimate jumps to 1; the posterior mean under a Beta(2, 2) prior is a more sensible 0.71. As draws accumulate, the posterior narrows around the true 0.75. Restart with a strong prior, Beta(33, 33), and the data need far longer to move it.</p>
  <p>Different summaries answer different losses: the mean minimises squared error, the median absolute error, and the mode is the MAP estimate. A 95% credible interval contains θ with 95% probability given the prior and the data, which is not what a confidence interval promises.</p>
  <p class="note">Data are simulated with θ = 0.75, the note's example value; the priors are ours.</p>`},
 {id:"pfn",ch:9,no:"",title:"Prior-data fitted networks",sub:"a network trained to do Bayesian inference",fig:{kind:"pfn"},figno:"",figtitle:"The answer a PFN learns to give",notes:[["prior-data-fitted-network","Prior-Data Fitted Network"],["bayes-theorem-for-probability-distributions","Bayes' for Distributions"]],html:`
  <p class="lead">A PFN skips fitting a posterior for each new dataset. It trains one network on endless synthetic datasets drawn from a prior, so one forward pass returns the posterior predictive.</p>
  <div class="eq">p(y | x, d) = ∫ p(y | x, t) p(t | d) dt</div>
  <p>Training needs only a way to sample: draw a task, draw n + 1 points, hide one, and teach the network to predict it from the rest. The note shows that the best network under this loss is exactly the posterior predictive, provided the inputs carry no information about the task.</p>
  <p>The context is a set, so the network is a transformer with one token per (x, y) pair and no position encoding. Given a new dataset, only the activations change; the weights stay fixed.</p>
  <p>On the right is the note's logistic setup: a hidden task t, points arriving one at a time, and the exact posterior predictive a PFN learns to imitate, computed on a grid. In our runs with 3 points it scored a loss of 0.52, against 2.38 for plugging in the best-fit task and 0.69 for a coin flip.</p>
  <p class="note">No trained network runs here; the figure shows its target. The prior (t₀ ~ N(0, 1), t₁ ~ N(0, 2²), x ~ U(−3, 3)) is ours, as the note doesn't specify one.</p>`},
 {id:"tabpfn",ch:9,no:"",title:"TabPFN",sub:"a PFN for tables",fig:{kind:"tabpfn"},figno:"",figtitle:"Tables from random causal models",notes:[["TabPFN","TabPFN"],["prior-data-fitted-network","Prior-Data Fitted Network"]],html:`
  <p class="lead">TabPFN is a PFN for small tables. Its prior is a distribution over data-generating mechanisms: random structural causal models (SCMs).</p>
  <p>Sample a random causal graph, give each node a function and some noise, run it, and read features and a label off the graph. Thresholding a continuous node gives classes. Millions of such tables train one network; on a real table it predicts in a single forward pass, with nothing fitted per table.</p>
  <p>The architecture respects tables: rows can be shuffled and so can columns. Attention alternates between the feature axis and the row axis, and query rows see only the training rows, never each other.</p>
  <p>For regression the output is a bar (Riemann) distribution: probabilities over buckets placed at the prior's quantiles. On the right, a target with two humps: ten bars fit it far better than one Gaussian, as the held-out loss shows.</p>
  <p class="note">The causal model and its weights are ours (the note's chain has no values). The note gives no benchmark numbers or size limits.</p>`},
 {id:"map",ch:10,no:"8.1",title:"The course on one page",sub:"42 topics, nine lines",fig:{kind:"map"},figno:"Exhibit 8.1",figtitle:"Click a station to open the note",notes:[["about-rl","About RL"],["glossary","Glossary"],["pseudocode","Pseudocode"]],html:`
  <p class="lead">The notes form a path: the problem, planning, learning from experience, approximation, policy methods and continuous control, then safety, offline data and search, and a toolbox of supporting ideas.</p>
  <p>Each note opens by naming the earlier notes it builds on, and ends with its sources. The glossary and pseudocode pages collect the notation and algorithms in one place.</p>
  <div class="cards">${MAP.map(([c,n,st])=>st.map(([slug,lab])=>`<a style="--cc:var(--c${c})" href="https://mattlanders.net/${slug}.html" target="_blank" rel="noopener">${lab}</a>`).join("")).join("")}</div>
  <p class="note">Every topic note has its own page here. The other three pages of the course are the introduction, the glossary and the pseudocode index.</p>`},
 {id:"quiz",ch:10,no:"8.2",title:"Check yourself",sub:"six questions, then build one",fig:{kind:"cover"},figno:"Exhibit 8.2",figtitle:"Back where we started",notes:[["implementations","Implementations"]],html:`
  <p class="lead">One question per big idea. Answer before you open each one.</p>
  ${chk("Why can a small γ make an agent ignore a cliff?","A cost k steps away counts γᵏ times as much. At γ = 0.5, a fall six steps out is worth about 1.6 today.")}
  ${chk("Value iteration on the cliff with γ = 1: what does each square's final value mean?","Minus the number of moves to the goal along the best route.")}
  ${chk("With ε = 0.1, which earns more while learning on the cliff, SARSA or Q-learning, and why?","SARSA (about −27 vs −51). It learns the value of its own exploring behaviour, so it keeps away from the edge where a random step is fatal.")}
  ${chk("Name the three legs of the deadly triad, and one way to remove one.","Function approximation, bootstrapping and off-policy training. Use a table, Monte Carlo targets or on-policy weighting.")}
  ${chk("PPO with ε = 0.2, φ = 0.6 and A = +2: which term is used, and does the gradient flow?","The unclipped one, 1.2, so yes: the update raises the good action's probability again.")}
  ${chk("Why doesn't GRPO need a critic?","The group's own mean is the baseline and its std sets the scale, so each answer's advantage comes from comparing it with its siblings.")}
  <p><b>Build it.</b> Write tabular SARSA and Q-learning for cliff walking (about 40 lines of Python) and reproduce Exhibit 3.4. The course's <a href="https://mattlanders.net/implementations.html" target="_blank" rel="noopener">implementations page</a> has reference code.</p>
  <p class="note">Credits: the notes are by Matt Landers (mattlanders.net). Cliff walking is from Sutton and Barto's <i>Reinforcement Learning: An Introduction</i>. The page format is inspired by Atlas of Physics. Simulations run in your browser with fixed random seeds.</p>`},
];
{const n={};PAGES.forEach(p=>{if(p.ch===0){p.no="0";}else{n[p.ch]=(n[p.ch]||0)+1;p.no=p.ch+"."+n[p.ch];}p.figno="Exhibit "+p.no;});}

/* ---------- engine: pages turn, one clock drives the figure ---------- */
const $=s=>document.querySelector(s);
const pg=$("#pg"),sheet=$("#sheet"),stage=$("#stage"),svg=$("#fig"),ro=$("#readout"),scrub=$("#scrub"),playBtn=$("#play"),prog=$("#prog"),toc=$("#toc");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur=0,F=null,clock=0,playing=!reduce,hold=0,lastTs=null,scrubbing=false,lastRO="";
const NOTE="https://mattlanders.net/";

const segBtns=[];
CH.forEach((c,ci)=>{const idx=PAGES.map((p,i)=>p.ch===ci?i:-1).filter(i=>i>=0);if(!idx.length)return;
  const seg=document.createElement("div");seg.className="seg";seg.style.setProperty("--n",idx.length);seg.style.setProperty("--cc",`var(--c${ci})`);seg.title=c.name;
  idx.forEach(i=>{const b=document.createElement("button");b.type="button";b.setAttribute("aria-label",`${PAGES[i].no} ${PAGES[i].title}`);b.title=`${PAGES[i].no}  ${PAGES[i].title}`;b.addEventListener("click",()=>go(i));seg.appendChild(b);segBtns[i]=b;});
  prog.appendChild(seg);});
const tocBtns=[];
CH.forEach((c,ci)=>{const idx=PAGES.map((p,i)=>p.ch===ci?i:-1).filter(i=>i>=0);if(!idx.length)return;
  const d=document.createElement("div");d.style.setProperty("--cc",`var(--c${ci})`);d.innerHTML=`<h3>${c.name}</h3><ol></ol>`;
  idx.forEach(i=>{const li=document.createElement("li"),b=document.createElement("button");b.type="button";b.innerHTML=`<span>${PAGES[i].no}</span>${PAGES[i].title}`;b.addEventListener("click",()=>{closeToc();go(i);});li.appendChild(b);d.querySelector("ol").appendChild(li);tocBtns[i]=b;});
  $("#tocgrid").appendChild(d);});
function openToc(){toc.classList.add("open");(tocBtns[cur]||tocBtns[0]).focus();}
function closeToc(){toc.classList.remove("open");$("#tocbtn").focus();}
$("#tocbtn").addEventListener("click",openToc);
toc.addEventListener("click",e=>{if(e.target===toc)closeToc();});

function build(){
  const W=Math.max(280,Math.round(stage.clientWidth)),H=Math.max(300,Math.round(stage.clientHeight));
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.textContent="";
  const prev=F,p=PAGES[cur];F=BUILD[p.fig.kind](svg,W,H,p.fig);F.domain=F.domain||p.fig.kind;
  if(!prev||prev.domain!==F.domain){clock=reduce?F.rest:F.t0;hold=0;}else clock=clamp(clock,F.t0,F.t1);
  $("#speed").textContent=F.label||"";
  svg.setAttribute("aria-label",p.figtitle);
  F.update(clock);writeRO();
}
function render(first){
  const p=PAGES[cur],c=CH[p.ch];
  document.documentElement.style.setProperty("--ch",`var(--c${p.ch})`);
  const notes=(p.notes||[]).map(([slug,name])=>`<a href="${NOTE}${slug}.html" target="_blank" rel="noopener">${name}</a>`).join(", ");
  const fill=()=>{pg.innerHTML=`<div class="kick"><span class="chip">${c.name}</span><span class="kno">${p.no}</span></div><h1>${p.title}</h1><p class="sub">${p.sub}</p>${p.html}<div class="foot"><span>${notes?"From the course: "+notes:""}</span><span>${cur+1} / ${PAGES.length}</span></div>`;pg.classList.remove("out");sheet.scrollTop=0;};
  if(first)fill();else{pg.classList.add("out");setTimeout(fill,160);}
  $("#figno").textContent=p.figno;$("#figtitle").textContent=p.figtitle;
  $("#count").textContent=`${cur+1} / ${PAGES.length}`;
  $("#prev").disabled=cur===0;$("#next").disabled=cur===PAGES.length-1;
  segBtns.forEach((b,i)=>{b.setAttribute("aria-current",i===cur?"true":"false");b.classList.toggle("done",i<cur);});
  tocBtns.forEach((b,i)=>b&&b.setAttribute("aria-current",i===cur?"true":"false"));
  try{history.replaceState(null,"","#"+p.id);}catch(e){}
  if(first||reduce)build();else{svg.classList.add("fade");setTimeout(()=>{build();svg.classList.remove("fade");},170);}
}
function go(i){i=clamp(i,0,PAGES.length-1);if(i===cur)return;cur=i;render(false);}
function writeRO(){if(!F)return;const h=F.readout(clock).map(([k,v])=>`<span class="k">${k}</span><span class="v">${v}</span>`).join("");if(h!==lastRO){ro.innerHTML=h;lastRO=h;}}
function tick(ts){
  const dt=lastTs==null?0:Math.min(.1,(ts-lastTs)/1000);lastTs=ts;
  if(F&&playing&&!scrubbing){if(hold>0){hold-=dt;if(hold<=0)clock=F.t0;}else{clock+=dt*F.speed;if(clock>=F.t1){clock=F.t1;hold=F.hold??2.6;}}}
  if(F){F.update(clock);if(!scrubbing)scrub.value=Math.round((clock-F.t0)/(F.t1-F.t0)*1000);writeRO();}
  requestAnimationFrame(tick);
}
const setPlay=v=>{playing=v;playBtn.textContent=v?"Pause":"Play";};
playBtn.addEventListener("click",()=>setPlay(!playing));
$("#replay").addEventListener("click",()=>{if(!F)return;clock=F.t0;hold=0;setPlay(true);});
scrub.addEventListener("input",()=>{if(!F)return;scrubbing=true;setPlay(false);hold=0;clock=F.t0+scrub.value/1000*(F.t1-F.t0);});
scrub.addEventListener("change",()=>{scrubbing=false;});
$("#prev").addEventListener("click",()=>go(cur-1));
$("#next").addEventListener("click",()=>go(cur+1));
addEventListener("keydown",e=>{
  if(toc.classList.contains("open")){if(e.key==="Escape")closeToc();return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;const tg=e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SUMMARY")return;
  if(["ArrowRight","ArrowDown","PageDown"].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==="Home"){go(0);}else if(e.key==="End"){go(PAGES.length-1);}
  else if(e.key===" "&&tg!=="BUTTON"){e.preventDefault();setPlay(!playing);}
});
const wide=matchMedia("(min-width: 861px)");
let acc=0,lock=0,accT=0;
addEventListener("wheel",e=>{
  if(!wide.matches||toc.classList.contains("open"))return;
  if(sheet.contains(e.target)){const down=sheet.scrollTop+sheet.clientHeight<sheet.scrollHeight-2,up=sheet.scrollTop>2;if((e.deltaY>0&&down)||(e.deltaY<0&&up))return;}
  e.preventDefault();const now=performance.now();if(now-accT>250)acc=0;accT=now;acc+=e.deltaY;
  if(Math.abs(acc)>40&&now>lock){go(cur+(acc>0?1:-1));lock=now+750;acc=0;}
},{passive:false});
let tx=null,ty=null;
stage.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
stage.addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4)go(cur+(dx<0?1:-1));tx=null;},{passive:true});
let rz=0,lastW=0,lastH=0;new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;if(Math.abs(w-lastW)<2&&Math.abs(h-lastH)<2)return;lastW=w;lastH=h;cancelAnimationFrame(rz);rz=requestAnimationFrame(build);}).observe(stage);

const start=PAGES.findIndex(p=>"#"+p.id===location.hash);if(start>0)cur=start;
addEventListener("hashchange",()=>{const i=PAGES.findIndex(p=>"#"+p.id===location.hash);if(i>=0)go(i);});
if(!playing)playBtn.textContent="Play";
render(true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(build);
requestAnimationFrame(tick);

})();
</script>
</body>
</html>
